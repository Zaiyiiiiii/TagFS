[package]
name = "tagfs-backend-hostdir"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TagFS 的宿主目录后端（路径目录兼容层）：把宿主目录里按路径组织的文件映射成实体"

[[bin]]
name = "tagfs-hostdir"
path = "src/bin/tagfs-hostdir.rs"

[dependencies]
