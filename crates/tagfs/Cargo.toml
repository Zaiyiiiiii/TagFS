[package]
name = "tagfs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TagFS：以 Tag 组织的文件系统。对外接口，组合逻辑层、各种存储单元和宿主机设备"

[dependencies]
getrandom = "0.3"
tagfs-block = { path = "../tagfs-block" }
tagfs-core = { path = "../tagfs-core" }
tagfs-device = { path = "../tagfs-device" }
tagfs-device-host = { path = "../tagfs-device-host" }
tagfs-backend-disk = { path = "../tagfs-backend-disk" }
tagfs-backend-file = { path = "../tagfs-backend-file" }
tagfs-backend-hostdir = { path = "../tagfs-backend-hostdir" }
tagfs-backend-mem = { path = "../tagfs-backend-mem" }
tagfs-backend-zip = { path = "../tagfs-backend-zip" }
# 运行在宿主操作系统上：锁等待时让出线程。
tagfs-sync = { path = "../tagfs-sync", features = ["std"] }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
