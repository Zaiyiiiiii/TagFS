[workspace]
resolver = "3"
members = [
    "crates/tagfs",
    "crates/tagfs-block",
    "crates/tagfs-core",
    "crates/tagfs-device",
    "crates/tagfs-device-host",
    "crates/tagfs-backend-file",
    "crates/tagfs-backend-hostdir",
    "crates/tagfs-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
